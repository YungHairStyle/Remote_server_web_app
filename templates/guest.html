<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guest CV</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
    }
    header {
      background-color: #6f42c1;
      color: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      margin: 0;
      font-size: 1.5rem;
    }
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }
    embed {
      border: 1px solid #dee2e6;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      width: 100%;
      height: 90%;
      max-width: 1000px;
    }
    .btn-back {
      background-color: white;
      color: #6f42c1;
      border: 2px solid white;
      transition: all 0.3s;
    }
    .btn-back:hover {
      background-color: #fff;
      color: #fff;
      border: 2px solid #fff;
    }
  </style>
</head>
<body>
  <header>
    <h1>Guest CV</h1>
    <a href="{{ url_for('login') }}" class="btn btn-light btn-back">Back to Login</a>
  </header>

  <main>
    <embed src="{{ url_for('guest_files', filename=cv_filename) }}" type="application/pdf">
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
